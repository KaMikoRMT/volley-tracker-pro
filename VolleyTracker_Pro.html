<style>
:root{--bg:#0c0e13;--surface:#141720;--card:#1b1f2e;--border:#252b3b;--accent:#f5a623;--danger:#e84343;--success:#3ecf6a;--info:#4a9eff;--warning:#e07a5f;--text:#e8eaf2;--muted:#7a849e}
*{box-sizing:border-box} body,html{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input,select{font-family:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.fifa-font{font-family:'Bebas Neue',cursive;letter-spacing:1px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}.btn{border:none;border-radius:12px;font-weight:900}.pill{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800}.pill.active{background:rgba(245,166,35,.15);border:2px solid var(--accent);color:var(--accent)}
.grid{display:grid;gap:14px}.muted{color:var(--muted);font-size:12px}.action-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;min-height:82px;text-align:left}.action-card.active{border:2px solid var(--accent);background:rgba(245,166,35,.12)}.context-chip{background:#10131b;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 12px;font-weight:800}.context-chip.active{background:var(--info);color:#000;border-color:var(--info)}.qbtn{padding:13px 5px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-weight:900}.bar-wrap{height:12px;background:#0f121a;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px}.mini{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px;text-align:center;white-space:nowrap}th{color:var(--muted);padding:10px;border-bottom:1px solid var(--border)}td{padding:10px;border-bottom:1px solid var(--card)}
@media(max-width:700px){.top{flex-direction:column;align-items:stretch!important}.nav{width:100%}.action-grid{grid-template-columns:1fr!important}.quality-grid{grid-template-columns:repeat(5,1fr)!important}.result-grid{grid-template-columns:1fr 1fr!important}.hide-mobile{display:none!important}}
</style>

<body><div id="root"><div style="padding:50px;text-align:center;color:var(--muted)"><h2 style="color:var(--accent)">系統載入中...</h2></div></div>
<script type="text/babel" data-presets="react,env">
const {useState,useMemo,useRef}=React;
const POSITIONS=["大砲","副攻","背","攔中","舉球","自由"];
const POS_WEIGHTS={"大砲":{ATK:.35,REC:.30,DEF:.20,BLK:.05,SET:0,FIX:0,SRV:.10},"副攻":{ATK:.45,REC:0,DEF:.20,BLK:.15,SET:0,FIX:.05,SRV:.15},"背":{ATK:.45,REC:0,DEF:.20,BLK:.15,SET:0,FIX:.05,SRV:.15},"攔中":{ATK:.35,REC:0,DEF:.10,BLK:.40,SET:0,FIX:.05,SRV:.10},"舉球":{ATK:.05,REC:0,DEF:.15,BLK:.10,SET:.60,FIX:0,SRV:.10},"自由":{ATK:0,REC:.50,DEF:.45,BLK:0,SET:0,FIX:.05,SRV:0}};
const ACTION_MAP={"發球":{contexts:null,attr:"SRV"},"接發":{contexts:null,attr:"REC"},"接扣":{contexts:null,attr:"DEF"},"防守":{contexts:["一般防守","吊球/Cover","接嗆司"],attr:"DEF"},"舉球":{contexts:["舉球","二次處理/吊球"],attr:"SET"},"攻擊":{contexts:["一般攻擊","吊球","處理球"],attr:"ATK"},"攔網":{contexts:null,attr:"BLK"},"修正":{contexts:null,attr:"FIX"}};
const ATTR_TO_CHINESE={ATK:"攻擊",REC:"接發",DEF:"防守",BLK:"攔網",SET:"舉球",FIX:"修正",SRV:"發球"};
const QUALITY_SCORES={S:100,A:75,B:50,C:25,F:0};
const QUALITY_LABELS={S:"完美",A:"有效",B:"一般",C:"不佳",F:"失誤"};
const QUALITY_COLORS={S:"var(--success)",A:"var(--info)",B:"var(--accent)",C:"var(--warning)",F:"var(--danger)"};
const Q_KEYS=["S","A","B","C","F"];
const VIEW_LABELS={setup:"名單",quick:"智慧快記",record:"完整紀錄",stats:"評分",details:"詳情",analytics:"視覺分析"};
const isAttacker=p=>["大砲","副攻","背","攔中"].includes(p?.pos);
const scoreColor=v=>v>=75?'var(--success)':v>=50?'var(--accent)':v>0?'var(--warning)':'var(--danger)';
function avg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0}
function VolleyApp(){
 const [view,setView]=useState('setup'),[players,setPlayers]=useState([{id:1,name:'大砲A',pos:'大砲'},{id:2,name:'舉球B',pos:'舉球'},{id:3,name:'自由C',pos:'自由'}]);
 const [logs,setLogs]=useState([]),[prevActionState,setPrevActionState]=useState({quality:null,action:null,logId:null,playerId:null,context:null});
 const [historyStack,setHistoryStack]=useState([]),[selectedPlayerId,setSelectedPlayerId]=useState(1),[selectedAction,setSelectedAction]=useState(null),[selectedContext,setSelectedContext]=useState(null);
 const [currentSet,setCurrentSet]=useState(1),[isExporting,setIsExporting]=useState(false),[viewSet,setViewSet]=useState(null); const fileInputRef=useRef(null);
 const selectedPlayer=players.find(p=>p.id===selectedPlayerId); const ppos=selectedPlayer?.pos;
 const saveStateToHistory=()=>setHistoryStack(h=>[...h,{logs:[...logs],prevActionState:{...prevActionState},currentSet}]);
 const handleUndo=()=>{if(!historyStack.length)return;const s=historyStack[historyStack.length-1];setLogs(s.logs);setPrevActionState(s.prevActionState);setCurrentSet(s.currentSet);setHistoryStack(h=>h.slice(0,-1));setSelectedAction(null);setSelectedContext(null)};
 const defaultContext=a=>ACTION_MAP[a]?.contexts?ACTION_MAP[a].contexts[0]:'一般';
 const currentSetLogs=useMemo(()=>logs.filter(l=>(l.setNo||1)===currentSet),[logs,currentSet]);
 const rallyLogs=useMemo(()=>{const out=[];for(const l of logs){if((l.setNo||1)!==currentSet)continue;if(l.type==='divider')break;out.push(l)}return out},[logs,currentSet]);
 const usedServe=rallyLogs.some(l=>l.type==='action'&&l.action==='發球'), usedReceive=rallyLogs.some(l=>l.type==='action'&&l.action==='接發');
 const lastDivider=logs.find(l=>l.type==='divider'); const lastPointWinner=lastDivider?lastDivider.winner:null; // us / them
 const addLog=(playerId,action,context,quality)=>{if(!playerId)return alert('請先選擇球員！'); if(ACTION_MAP[action].contexts&&!context)return alert(`請先選擇「${action}」細項`); saveStateToHistory(); let finalScore=QUALITY_SCORES[quality],note='',newLogId=Date.now()+Math.random(); setLogs(prev=>{let updated=[...prev];const prevQ=prevActionState.quality;if(prevActionState.action==='舉球'&&action==='攻擊'){if(['B','C','F'].includes(prevQ)){if(quality==='F'){finalScore=25;note='爛球豁免(25分)';updated=updated.map(l=>l.id===prevActionState.logId?{...l,scoreDelta:l.scoreDelta-25,note:(l.note?l.note+', ':'')+'配球失分主責'}:l)}else if(['S','A'].includes(quality)){finalScore*=1.2;note='神救援(1.2x)'}}else if(['S','A'].includes(prevQ)&&quality==='F'){finalScore-=20;note='浪費好配球(-20)'}} const newLog={id:newLogId,type:'action',setNo:currentSet,playerId,action,context:context||'一般',quality,prevQuality:prevQ,prevAction:prevActionState.action,prevPlayerId:prevActionState.playerId,prevContext:prevActionState.context,scoreDelta:finalScore,note,timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}; return [newLog,...updated]}); setPrevActionState({quality,action,logId:newLogId,playerId,context:context||'一般'}); setSelectedAction(null);setSelectedContext(null)};
 const resolvePoint=(type)=>{saveStateToHistory(); setLogs(prev=>{const targetIndex=prev.findIndex(l=>l.type==='action'&&(l.setNo||1)===currentSet);let updated=[...prev];let resultLabel,winner,bonus=true;if(type==='win'){resultLabel='我方得分';winner='us'} if(type==='lose'){resultLabel='我方失分';winner='them'} if(type==='opponent'){resultLabel='對手好球';winner='them';bonus=false} if(type==='oppError'){resultLabel='對方失誤';winner='us';bonus=false} if(targetIndex!==-1&&bonus&&(type==='win'||type==='lose')){const t=updated[targetIndex],delta=type==='win'?20:-20,noteStr=type==='win'?'得分加成':'失分責任';updated[targetIndex]={...t,scoreDelta:t.scoreDelta+delta,note:(t.note?t.note+' / ':'')+noteStr}} return [{id:Date.now()+Math.random(),type:'divider',setNo:currentSet,result:resultLabel,winner},...updated]}); setPrevActionState({quality:null,action:null,logId:null,playerId:null,context:null});setSelectedAction(null);setSelectedContext(null)};
 const startNextSet=()=>{saveStateToHistory();const ns=Math.min(3,currentSet+1);setCurrentSet(ns);setViewSet(ns);setPrevActionState({quality:null,action:null,logId:null,playerId:null,context:null});setSelectedAction(null);setSelectedContext(null)};
 const switchSet=n=>{setCurrentSet(n);setViewSet(n);setPrevActionState({quality:null,action:null,logId:null,playerId:null,context:null});setSelectedAction(null);setSelectedContext(null)};
 const handleFileUpload=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.players&&d.logs){setPlayers(d.players);setLogs(d.logs.map(l=>({...l,setNo:l.setNo||1})));setCurrentSet(d.currentSet||1);setSelectedPlayerId(d.players[0]?.id||null);alert('✅ 資料載入成功')}}catch(err){alert('❌ 解析失敗')}};r.readAsText(file);e.target.value=''};
 const handleExport=()=>{const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({players,logs,currentSet}));a.download='VolleyTracker_Backup.json';a.click();setIsExporting(true);setTimeout(()=>{const target=document.getElementById('report-container');if(window.html2canvas&&target){window.html2canvas(target,{backgroundColor:'#0c0e13',scale:2,useCORS:true,logging:false}).then(c=>c.toBlob(b=>{const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`VolleyReport-${new Date().toLocaleDateString().replace(/\//g,'-')}.png`;l.click();setTimeout(()=>URL.revokeObjectURL(u),100);setIsExporting(false)},'image/png'))}else setIsExporting(false)},500)};
 const suggestOptions=()=>{let opts=[];const prev=prevActionState.action,prevCtx=prevActionState.context;
   if(!prev){ if(lastPointWinner==='us'){if(!usedServe)opts.push({a:'發球',c:['一般'],why:'上一分我方得分，優先發球'})} else if(lastPointWinner==='them'){if(!usedReceive)opts.push({a:'接發',c:['一般'],why:'上一分對方得分，優先接發'})} else {if(!usedServe)opts.push({a:'發球',c:['一般'],why:'開局可選'});if(!usedReceive)opts.push({a:'接發',c:['一般'],why:'開局可選'})} }
   if(prev==='接發'&&ppos==='舉球'){opts.push({a:'舉球',c:['舉球','二次處理/吊球'],why:'接發後的主要選項'});opts.push({a:'修正',c:['一般'],why:'接發不到位時'});}
   else if(['舉球','修正'].includes(prev)&&isAttacker(selectedPlayer)){opts.push({a:'攻擊',c:['一般攻擊','吊球','處理球'],why:'進攻回合'});}
   else if(prev&&prev!=='接發'){opts.push({a:'接扣',c:['一般'],why:'防守回合'});opts.push({a:'防守',c:['一般防守','吊球/Cover','接嗆司'],why:'防守回合'});if(ppos!=='自由')opts.push({a:'攔網',c:['一般'],why:'網前防守'});}
   if(opts.length===0){ if(ppos==='舉球')opts.push({a:'舉球',c:['舉球','二次處理/吊球'],why:'舉球員常用'}); if(ppos!=='舉球'&&ppos!=='自由')opts.push({a:'攻擊',c:['一般攻擊','吊球','處理球'],why:'攻擊手常用'}); if(ppos==='自由')opts.push({a:'攻擊',c:['吊球','處理球'],why:'自由限定處理'}); opts.push({a:'防守',c:['一般防守','吊球/Cover','接嗆司'],why:'通用'}); }
   // general constraints
   opts=opts.filter(o=>!(o.a==='舉球'&&ppos!=='舉球')).filter(o=>!(o.a==='攔網'&&ppos==='自由')).map(o=>ppos==='自由'&&o.a==='攻擊'?{...o,c:o.c.filter(x=>x!=='一般攻擊')}:o).filter(o=>o.c.length>0);
   if(usedServe)opts=opts.filter(o=>o.a!=='發球'); if(usedReceive)opts=opts.filter(o=>o.a!=='接發');
   if(ppos==='舉球'&&!opts.some(o=>o.a==='舉球'))opts.push({a:'舉球',c:['舉球','二次處理/吊球'],why:'舉球員常用'});
   const key=new Set();return opts.filter(o=>{const k=o.a+o.c.join('|');if(key.has(k))return false;key.add(k);return true}); };
 const quickOptions=suggestOptions();
 const selectOpt=(o)=>{setSelectedAction(o.a);setSelectedContext(o.c[0]==='一般'?defaultContext(o.a):o.c[0])};
 const PlayerSelector=()=> <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{players.map((p,i)=><button key={p.id} onClick={()=>{setSelectedPlayerId(p.id);setSelectedAction(null);setSelectedContext(null)}} className={`pill ${selectedPlayerId===p.id?'active':''}`}>{i+1}. {p.name}<span className="mini"> ({p.pos})</span></button>)}</div>;
 const ResultButtons=()=> <div className="result-grid" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}><button onClick={()=>resolvePoint('win')} className="btn" style={{padding:12,background:'rgba(62,207,106,.15)',border:'2px solid var(--success)',color:'var(--success)'}}>✓ 我方得分<br/><span className="mini">最後觸球加成</span></button><button onClick={()=>resolvePoint('oppError')} className="btn" style={{padding:12,background:'rgba(62,207,106,.08)',border:'2px dashed var(--success)',color:'var(--success)'}}>＋ 對方失誤<br/><span className="mini">不加成球員</span></button><button onClick={()=>resolvePoint('lose')} className="btn" style={{padding:12,background:'rgba(232,67,67,.15)',border:'2px solid var(--danger)',color:'var(--danger)'}}>✗ 我方失分<br/><span className="mini">最後觸球扣分</span></button><button onClick={()=>resolvePoint('opponent')} className="btn" style={{padding:12,background:'rgba(245,166,35,.15)',border:'2px solid var(--accent)',color:'var(--accent)'}}>🛡 對手好球<br/><span className="mini">不扣分</span></button></div>;
 const LogList=()=> <div className="card" style={{maxHeight:340,overflowY:'auto'}}>{currentSetLogs.length===0?<div className="muted" style={{textAlign:'center',padding:20}}>本局尚無紀錄</div>:currentSetLogs.map(l=>l.type==='divider'?<div key={l.id} style={{textAlign:'center',margin:'14px 0',borderTop:'1px dashed var(--border)',padding:'10px 0'}}><span style={{background:l.winner==='us'?'var(--success)':l.result==='對手好球'?'var(--accent)':'var(--danger)',color:'#000',padding:'4px 12px',borderRadius:12,fontWeight:900,fontSize:11}}>第{l.setNo||1}局｜{l.result}</span></div>:<div key={l.id} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'10px 0',borderBottom:'1px solid var(--card)',fontSize:13}}><span><b>{players.find(p=>p.id===l.playerId)?.name||'未知'}</b>：{l.context==='一般'?l.action:l.context} ({l.quality})</span><span style={{fontWeight:900,color:scoreColor(l.scoreDelta)}}>{Math.round(l.scoreDelta)} <small>{l.note}</small></span></div>)}</div>;
 const QuickSection=()=> <div className="grid"><div className="card"><div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap',alignItems:'center'}}><div><h3 style={{margin:'0 0 5px'}}>⚡ 智慧快記</h3><div className="muted">依照前置動作、位置與本分狀態自動縮小選項。現在是第 <b style={{color:'var(--accent)'}}>{currentSet}</b> 局。</div></div><div style={{display:'flex',gap:8}}><button disabled={!historyStack.length} onClick={handleUndo} className="pill">⮌ 復原</button><button onClick={()=>{saveStateToHistory();setPrevActionState({quality:null,action:null,logId:null,playerId:null,context:null});setSelectedAction(null);setSelectedContext(null)}} className="pill">↻ 斷開前置</button></div></div><div style={{height:12}}/><PlayerSelector/></div>
 <div className="card"><div className="muted" style={{marginBottom:10}}>目前球員：<b style={{color:'var(--accent)'}}>{selectedPlayer?.name||'未選擇'}</b>　前置：<b style={{color:'var(--info)'}}>{prevActionState.action?`${prevActionState.context||prevActionState.action} (${prevActionState.quality})`:'無'}</b>　發球/接發：{usedServe?'已發球':'未發球'} / {usedReceive?'已接發':'未接發'}</div>
 {(()=>{const flat=quickOptions.flatMap(o=>o.c.length===1?[{a:o.a,c:o.c[0]==='一般'?defaultContext(o.a):o.c[0],label:o.a,why:o.why}]:o.c.map(c=>({a:o.a,c,label:c,why:o.why})));return<><div className="action-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10}}>{flat.map((item,idx)=>{const isActive=selectedAction===item.a&&selectedContext===item.c;return<button key={idx} onClick={()=>{setSelectedAction(item.a);setSelectedContext(item.c)}} className={`action-card ${isActive?'active':''}`}><div style={{fontSize:16,fontWeight:900,color:isActive?'var(--accent)':'#fff'}}>{item.label}</div><div className="mini" style={{marginTop:3}}>{item.why}</div></button>})}</div>{selectedAction&&selectedContext&&<div style={{marginTop:16,paddingTop:16,borderTop:'1px dashed var(--border)'}}><div className="muted" style={{marginBottom:8}}>品質</div><div className="quality-grid" style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>{Q_KEYS.map(q=><button key={q} onClick={()=>addLog(selectedPlayerId,selectedAction,selectedContext,q)} className="qbtn" style={{borderColor:QUALITY_COLORS[q]}}><div className="fifa-font" style={{fontSize:27,color:QUALITY_COLORS[q]}}>{q}</div><div className="mini hide-mobile">{QUALITY_LABELS[q]}</div></button>)}</div></div>}</>})()}
 </div><ResultButtons/><LogList/></div>;
 const playerStats=useMemo(()=>players.map(p=>{const pLogs=logs.filter(l=>l.type==='action'&&l.playerId===p.id);const base=POS_WEIGHTS[p.pos];const attrLogs={ATK:[],REC:[],DEF:[],BLK:[],SET:[],FIX:[],SRV:[]};pLogs.forEach(l=>{const attr=ACTION_MAP[l.action]?.attr;if(attr)attrLogs[attr].push(l)});let stats={},normWeights={},ovr=0,totalW=0;Object.keys(attrLogs).forEach(a=>{if(base[a]>0&&attrLogs[a].length){stats[a]=Math.min(100,Math.max(0,avg(attrLogs[a].map(x=>x.scoreDelta))));totalW+=base[a]}});Object.keys(stats).forEach(a=>{normWeights[a]=base[a]/totalW;ovr+=stats[a]*normWeights[a]});return{...p,stats,normWeights,ovr:Math.round(ovr)}}),[logs,players]);
 const StatsSection=({filterSet=null})=>{const data=filterSet?logs.filter(l=>(l.setNo||1)===filterSet):logs;return <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16}}>{playerStats.map(p=><div key={p.id} className="card" style={{borderColor:'var(--accent)'}}><div style={{display:'flex',gap:14,alignItems:'center'}}><div><div className="fifa-font" style={{fontSize:48,color:'var(--accent)',lineHeight:.9}}>{p.ovr}</div><div className="mini" style={{fontWeight:900}}>{p.pos}</div></div><div><div style={{fontSize:20,fontWeight:900}}>{p.name}</div><div className="mini">{Object.entries(p.normWeights||{}).map(([k,w])=>`${ATTR_TO_CHINESE[k]} ${Math.round(w*100)}%`).join(' / ')||'等待數據'}</div></div></div><div style={{marginTop:15,display:'grid',gap:8}}>{Object.entries(p.stats).map(([k,v])=><div key={k}><div style={{display:'flex',justifyContent:'space-between'}}><span>{ATTR_TO_CHINESE[k]}</span><b style={{color:scoreColor(v)}}>{v}</b></div><div className="bar-wrap"><div className="bar" style={{width:v+'%',background:scoreColor(v)}}></div></div></div>)}</div></div>)}</div>}
 const DetailsSection=()=> <div className="grid">{players.map(p=>{const pLogs=logs.filter(l=>l.type==='action'&&l.playerId===p.id);return <div key={p.id} className="card"><h3 style={{marginTop:0}}><span style={{color:'var(--accent)'}}>{p.pos}</span> {p.name}</h3>{pLogs.length===0?<div className="muted">尚無紀錄</div>:<table><thead><tr><th>動作</th><th>細項</th>{Q_KEYS.map(q=><th key={q}>{q}</th>)}<th>均分</th></tr></thead><tbody>{Object.entries(pLogs.reduce((m,l)=>{const k=l.action+'|'+l.context;(m[k]=m[k]||[]).push(l);return m},{})).map(([k,arr])=>{const [a,c]=k.split('|'),counts={S:0,A:0,B:0,C:0,F:0};arr.forEach(l=>counts[l.quality]++);return <tr key={k}><td>{a}</td><td>{c}</td>{Q_KEYS.map(q=><td key={q}>{counts[q]}</td>)}<td><b style={{color:scoreColor(avg(arr.map(x=>x.scoreDelta)))}}>{avg(arr.map(x=>x.scoreDelta))}</b></td></tr>})}</tbody></table>}</div>})}</div>;
 const VisualAnalytics=({filterSet=null,title=''})=>{const data=logs.filter(l=>l.type==='action'&&(!filterSet||(l.setNo||1)===filterSet));const attackers=players.filter(isAttacker);const setters=players.filter(p=>p.pos==='舉球'); const defenseContexts=['接發','接扣','一般防守','吊球/Cover','接嗆司'];
   const attackRows=attackers.map(p=>{const arr=data.filter(l=>l.playerId===p.id&&l.action==='攻擊');const groups={};arr.forEach(l=>{groups[l.context]=groups[l.context]||[];groups[l.context].push(l)});return{p,arr,groups}});
   const setRows=setters.map(s=>{const sets=data.filter(l=>l.playerId===s.id&&l.action==='舉球');const byQuality=avg(sets.map(x=>x.scoreDelta));const attacks=data.filter(l=>l.action==='攻擊'&&l.prevPlayerId===s.id);const byTarget={};attacks.forEach(l=>{byTarget[l.playerId]=byTarget[l.playerId]||[];byTarget[l.playerId].push(l)});return{s,sets,byQuality,byTarget}});
   return <div className="grid"><h2 style={{margin:'10px 0 0'}}>{title||'視覺分析'}</h2><div className="card"><h3 style={{marginTop:0}}>🔥 攻擊手：攻擊方法頻率 × 評分</h3>{attackRows.map(r=><div key={r.p.id} style={{marginBottom:18}}><div style={{display:'flex',justifyContent:'space-between'}}><b>{r.p.name} <span className="mini">({r.p.pos})</span></b><span className="mini">攻擊 {r.arr.length} 次</span></div>{['一般攻擊','吊球','處理球'].map(ctx=>{const a=r.groups[ctx]||[],pct=r.arr.length?Math.round(a.length/r.arr.length*100):0,score=avg(a.map(x=>x.scoreDelta));return <div key={ctx} style={{marginTop:8}}><div style={{display:'flex',justifyContent:'space-between'}}><span>{ctx} <span className="mini">{a.length}次 / {pct}%</span></span><b style={{color:scoreColor(score)}}>{a.length?score:'-'}</b></div><div className="bar-wrap"><div className="bar" style={{width:pct+'%',background:scoreColor(score)}}></div></div></div>})}</div>)}</div>
   <div className="card"><h3 style={{marginTop:0}}>🧠 舉球：配球對象 × 舉球品質</h3>{setRows.length===0?<div className="muted">尚無舉球員</div>:setRows.map(r=><div key={r.s.id} style={{marginBottom:18}}><div style={{display:'flex',justifyContent:'space-between'}}><b>{r.s.name}</b><span>舉球均分 <b style={{color:scoreColor(r.byQuality)}}>{r.sets.length?r.byQuality:'-'}</b></span></div><div className="mini" style={{margin:'6px 0'}}>細項：{['舉球','二次處理/吊球'].map(c=>{const a=r.sets.filter(x=>x.context===c);return `${c} ${a.length?avg(a.map(x=>x.scoreDelta)):'-'}分/${a.length}次`}).join('　')}</div>{players.filter(isAttacker).map(t=>{const a=r.byTarget[t.id]||[],total=Object.values(r.byTarget).reduce((s,x)=>s+x.length,0),pct=total?Math.round(a.length/total*100):0,score=avg(a.map(x=>x.scoreDelta));return <div key={t.id} style={{marginTop:8}}><div style={{display:'flex',justifyContent:'space-between'}}><span>→ {t.name} <span className="mini">{a.length}次 / {pct}%</span></span><b style={{color:scoreColor(score)}}>{a.length?score:'-'}</b></div><div className="bar-wrap"><div className="bar" style={{width:pct+'%',background:scoreColor(score)}}></div></div></div>})}</div>)}</div>
   <div className="card"><h3 style={{marginTop:0}}>🛡 團隊防守面向評分</h3>{defenseContexts.map(ctx=>{let arr=ctx==='接發'?data.filter(l=>l.action==='接發'):ctx==='接扣'?data.filter(l=>l.action==='接扣'):data.filter(l=>l.action==='防守'&&l.context===ctx);const sc=avg(arr.map(x=>x.scoreDelta));return <div key={ctx} style={{marginTop:10}}><div style={{display:'flex',justifyContent:'space-between'}}><span>{ctx} <span className="mini">{arr.length}次</span></span><b style={{color:scoreColor(sc)}}>{arr.length?sc:'-'}</b></div><div className="bar-wrap"><div className="bar" style={{width:(arr.length?sc:0)+'%',background:scoreColor(sc)}}></div></div></div>})}</div></div>};
 const RecordSection=()=> <div className="grid"><ResultButtons/><div className="card"><div style={{display:'flex',justifyContent:'space-between'}}><h3 style={{margin:0}}>完整紀錄台</h3><button onClick={handleUndo} disabled={!historyStack.length} className="pill">⮌ 復原</button></div><div style={{height:12}}/><PlayerSelector/><div className="muted" style={{marginTop:18}}>動作</div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(90px,1fr))',gap:8}}>{Object.keys(ACTION_MAP).map(a=><button key={a} onClick={()=>{setSelectedAction(a);setSelectedContext(defaultContext(a))}} className={`pill ${selectedAction===a?'active':''}`}>{a}</button>)}</div>{selectedAction&&<><div className="muted" style={{marginTop:14}}>細項</div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{(ACTION_MAP[selectedAction].contexts||['一般']).map(c=><button key={c} onClick={()=>setSelectedContext(c==='一般'?defaultContext(selectedAction):c)} className={`context-chip ${selectedContext===(c==='一般'?defaultContext(selectedAction):c)?'active':''}`}>{c}</button>)}</div><div className="quality-grid" style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginTop:14}}>{Q_KEYS.map(q=><button key={q} onClick={()=>addLog(selectedPlayerId,selectedAction,selectedContext||defaultContext(selectedAction),q)} className="qbtn" style={{borderColor:QUALITY_COLORS[q]}}><div className="fifa-font" style={{fontSize:26,color:QUALITY_COLORS[q]}}>{q}</div></button>)}</div></>}</div><LogList/></div>;
 const setButtons=<div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:15}}>{[1,2,3].map(n=><button key={n} onClick={()=>switchSet(n)} className={`pill ${currentSet===n?'active':''}`}>第{n}局</button>)}<button onClick={startNextSet} disabled={currentSet>=3} className="pill">＋ 下一局</button></div>;
 return <div style={{maxWidth:980,margin:'0 auto',padding:20}}><div className="top" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginBottom:18}}><div><h1 className="fifa-font" style={{color:'var(--accent)',margin:0,fontSize:31}}>VOLLEY TRACKER PRO</h1><p className="muted" style={{margin:0}}>智慧快記 × 視覺分析 × 分局報告</p></div><div className="nav" style={{display:'flex',gap:8,flexWrap:'wrap'}}>{Object.entries(VIEW_LABELS).map(([v,l])=><button key={v} onClick={()=>setView(v)} className="pill" style={{background:view===v?'var(--accent)':'var(--card)',color:view===v?'#000':'var(--muted)'}}>{l}</button>)}<button onClick={handleExport} disabled={!logs.length||isExporting} className="pill" style={{borderColor:'var(--danger)',color:'var(--danger)'}}>{isExporting?'匯出中...':'📸 結束存檔'}</button></div></div>{setButtons}
 {view==='setup'&&<div className="grid"><div className="card" style={{borderStyle:'dashed',borderColor:'var(--info)',background:'rgba(74,158,255,.08)'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}><div><h3 style={{margin:0,color:'var(--info)'}}>📂 讀取歷史紀錄</h3><div className="muted">可讀取此版本或舊版 JSON；舊資料會自動歸入第一局。</div></div><input type="file" accept=".json" ref={fileInputRef} onChange={handleFileUpload} style={{display:'none'}}/><button onClick={()=>fileInputRef.current.click()} className="btn" style={{padding:'10px 18px',background:'var(--info)',color:'#000'}}>載入 JSON</button></div></div><div className="card">{players.map((p,i)=><div key={p.id} style={{display:'flex',gap:8,marginBottom:8}}><input value={p.name} onChange={e=>{const n=[...players];n[i].name=e.target.value;setPlayers(n)}} style={{flex:1,background:'var(--bg)',border:'1px solid var(--border)',color:'#fff',padding:10,borderRadius:10}}/><select value={p.pos} onChange={e=>{const n=[...players];n[i].pos=e.target.value;setPlayers(n)}} style={{background:'var(--bg)',border:'1px solid var(--border)',color:'#fff',padding:10,borderRadius:10}}>{POSITIONS.map(pos=><option key={pos}>{pos}</option>)}</select><button onClick={()=>setPlayers(players.filter(x=>x.id!==p.id))} className="btn" style={{background:'var(--danger)',color:'#fff',padding:'0 14px'}}>×</button></div>)}<button onClick={()=>setPlayers([...players,{id:Date.now(),name:'新球員',pos:'大砲'}])} className="pill" style={{width:'100%'}}>＋ 新增球員</button></div></div>}
 {view==='quick'&&<QuickSection/>}{view==='record'&&<RecordSection/>}{view==='stats'&&<StatsSection/>}{view==='details'&&<DetailsSection/>}{view==='analytics'&&<VisualAnalytics/>}
 <div style={{position:'absolute',left:'-9999px',top:'-9999px',width:900,visibility:isExporting?'visible':'hidden'}}><div id="report-container" style={{width:900,padding:30,background:'#0c0e13',color:'#e8eaf2'}}><h1 className="fifa-font" style={{textAlign:'center',color:'#f5a623',fontSize:42,margin:0}}>VOLLEY TRACKER REPORT</h1><p style={{textAlign:'center',color:'#7a849e'}}>整場比賽 + 分局剖析</p><VisualAnalytics title="整場比賽分析"/><div style={{height:30}}/>{[1,2,3].filter(n=>logs.some(l=>(l.setNo||1)===n)).map(n=><div key={n}><VisualAnalytics filterSet={n} title={`第${n}局分析`}/><div style={{height:30}}/></div>)}</div></div>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<VolleyApp/>);
</script></body></html>
